name: Feature request
description: Propose a focused desk-hub or SmallTV Pro improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Conductor or agent integration
        - Agent Hub display
        - Touch controls
        - Web dashboard
        - Ticker or weather
        - Build, setup, or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user need rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the desired device interaction and any local service involved.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Privacy or hardware constraints
      description: Note credential handling, network access, display size, flash, RAM, or touch implications.
